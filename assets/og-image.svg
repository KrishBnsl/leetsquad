  <circle cx="1190" cy="360" r="250" fill="#4d96ff" opacity=".38" filter="url(#blur)"/>
  <circle cx="560" cy="660" r="230" fill="#ffd23f" opacity=".5" filter="url(#blur)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

